name: uncommonAI Growth Test (Parallel V2)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for growth test pipeline'
        required: true
        default: 'Model Context Protocol security blind spots in testing'
        type: string

jobs:
  run-growth-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Run Parallel Growth Pipeline
        env:
          UNCOMMONAI_MODE: 'produce'
          APPROVED_TOPIC: ${{ github.event.inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python uncommonai_cloud_v2.py
