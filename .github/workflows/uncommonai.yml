name: uncommonAI Autopilot V4

on:
  schedule:
    - cron: "0 4 * * 1"

  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to run"
        required: true
        default: "research"
        type: choice
        options:
          - research
          - produce
      approved_topic:
        description: "Topic for produce mode"
        required: false
        type: string

  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  research:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'research')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run AI research
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNCOMMONAI_MODE: research
        run: python .github/workflow/uncommonai_cloud.py

      - name: Debug research workspace
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Workspace:"
          ls -la ./workspace/ || true
          echo ""
          echo "Files:"
          find ./workspace -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Save research
        uses: actions/upload-artifact@v4
        with:
          name: uncommonai-research
          path: ./workspace/
          retention-days: 7
          if-no-files-found: error

  produce_from_approval:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'produce') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, 'APPROVE') &&
       contains(github.event.issue.body, '<!-- uncommonai-topic-approval -->'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Extract approved topic
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_TOPIC: ${{ inputs.approved_topic }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re

          event_name = os.environ["EVENT_NAME"]
          dispatch_topic = os.environ.get("DISPATCH_TOPIC", "").strip()

          if event_name == "workflow_dispatch":
              topic = dispatch_topic
          else:
              body = os.environ["ISSUE_BODY"]

              patterns = [
                  r"##\s+Recommended topic\s*\n\s*\*\*(.+?)\*\*",
                  r"##\s+Recommended YouTube concept\s*\n\s*\*\*(.+?)\*\*",
              ]

              topic = None

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      body,
                      re.IGNORECASE | re.DOTALL
                  )

                  if match:
                      topic = re.sub(
                          r"\s+",
                          " ",
                          match.group(1)
                      ).strip()
                      break

          if not topic:
              raise SystemExit(
                  "No approved topic supplied. For manual produce testing, enter a topic in approved_topic."
              )

          print(f"Approved topic: {topic}")

          with open("/tmp/topic.txt", "w", encoding="utf-8") as f:
              f.write(topic)
          PY

      - name: Generate production package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          UNCOMMONAI_MODE: produce
        run: |
          export APPROVED_TOPIC="$(cat /tmp/topic.txt)"
          python .github/workflow/uncommonai_cloud.py

      - name: Debug production workspace
        run: |
          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"
          pwd

          echo ""
          echo "========================================"
          echo "ROOT DIRECTORY"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "WORKSPACE DIRECTORY"
          echo "========================================"
          ls -la ./workspace/ || true

          echo ""
          echo "========================================"
          echo "WORKSPACE FILES"
          echo "========================================"
          find ./workspace -maxdepth 3 -type f -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "ALL GENERATED FILES"
          echo "========================================"
          find . -maxdepth 5 -type f \
            \( -name "package.json" \
            -o -name "production_package.json" \
            -o -name "production.md" \
            -o -name "quality_gate.json" \) \
            -print 2>/dev/null || true

      - name: Save production package
        uses: actions/upload-artifact@v4
        with:
          name: uncommonai-production
          path: ./workspace/
          retention-days: 7
          if-no-files-found: error

      - name: Request final approval
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ Production package is ready. Download the **uncommonai-production** artifact, review it, then comment **PUBLISH** when you approve. No YouTube video has been published yet."

  final_approval:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, 'PUBLISH') && contains(github.event.issue.body, '<!-- uncommonai-topic-approval -->')
    runs-on: ubuntu-latest

    steps:
      - name: Confirm final approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ PUBLISH approval received. YouTube publishing will be enabled after the one-time OAuth setup is completed. No video has been published yet."
